<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaSort UI</title>
    <style>
        /* 1. The Desktop Background (Vibrant enough to show off the glass) */
        body { 
            font-family: 'Sora', 'Montserrat', sans-serif;
            letter-spacing: 1px;
            font-weight: 700;
            /*font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;*/
            
            margin: 0; 
            padding: 40px; 
            min-height: 100vh;
            background: linear-gradient(135deg, #120e17, #433541, #251439); /* Deep Win7-esque teal */
            color: #975151; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. The Aero Glass Pane (The magic is backdrop-filter) */
        .container { 
            width: 100%;
            max-width: 500px; 
            padding: 35px; 
            border-radius: 12px; 
            
            /* The Frosted Glass Illusion */
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            
            /* The subtle light border that defines Win7 */
            border: 0.5px solid rgba(255, 255, 255, 0.15); 
            border-top: 0.5px solid rgba(255, 255, 255, 0.3);
            border-left: 0.5px solid rgba(255, 255, 255, 0.3);
            
            /* The drop shadow for physical depth */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2); 
        }

        h2 {
            margin-top: 0;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            display: block;
            margin-top: 20px;
        }

        /* 3. Minimalistic Input Fields (Inset Glass) */
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border-radius: 6px; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white;
            font-family: monospace;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Style the dropdown options so they don't look broken in dark mode */
        option { background: #203a43; color: white; }

        /* 4. The Execution Button */
        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 25px;
            margin-bottom: 20px; 
            border-radius: 6px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            font-weight: bold; 
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }

        button:hover { 
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        
        button:active {
            transform: scale(0.98);
        }

        /* 5. Warning & Terminal Output */
        .warning { 
            background: rgba(255, 208, 208, 0.15); 
            border-left: 4px solid #a8a599;
            color: #fff; 
            padding: 12px; 
            margin-top: 20px;
            border-radius: 4px; 
            font-size: 0.85em; 
            display: none; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        pre {
            background: rgba(0, 0, 0, 0.4); 
            padding: 15px; 
            border-radius: 6px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto; 
            font-size: 0.8em;
            color: #aacac3; /* Hacker terminal green/cyan */
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        
        /* Flexbox for the Input + Browse Button */
        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .input-group input {
            margin-top: 0; /* Reset margin since flexbox handles it */
            flex-grow: 1;  /* Makes input take up remaining space */
        }

        .browse-btn {
            width: auto;
            margin: 0;
            padding: 0 15px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 1.2em;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>MetaSort</h2>
    
    <label>Source Directory (Messy Photos)</label>
    <div class="input-group">
        <input type="text" id="source" placeholder="e.g. D:\Project_MetaSort\test_data">
        <button class="browse-btn" onclick="selectFolder('source')" title="Browse Folders"> 
            <svg width="24" height="25" viewBox="0 -2 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.25 15.75C11.25 16.1642 11.5857 16.5 12 16.5C12.4142 16.5 12.75 16.1642 12.75 15.75V13.75H14.75C15.1642 13.75 15.5 13.4142 15.5 13C15.5 12.5858 15.1642 12.25 14.75 12.25H12.75V10.25C12.75 9.83579 12.4142 9.5 12 9.5C11.5857 9.5 11.25 9.83579 11.25 10.25V12.25H9.24996C8.83574 12.25 8.49996 12.5858 8.49996 13C8.49996 13.4142 8.83574 13.75 9.24996 13.75H11.25V15.75Z" fill="black"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5857 4.58579L12 6H20C21.1045 6 22 6.89543 22 8V18C22 19.1046 21.1045 20 20 20H3.99995C2.89539 20 1.99995 19.1046 1.99995 18V6C1.99995 4.89543 2.89538 4 3.99995 4H9.17153C9.70196 4 10.2107 4.21071 10.5857 4.58579ZM12 7.5C11.6021 7.5 11.2206 7.34196 10.9393 7.06066L9.52508 5.64645C9.43131 5.55268 9.30414 5.5 9.17153 5.5H3.99995C3.72381 5.5 3.49995 5.72386 3.49995 6V18C3.49995 18.2761 3.72381 18.5 3.99995 18.5H20C20.2761 18.5 20.5 18.2761 20.5 18V8C20.5 7.72386 20.2761 7.5 20 7.5H12Z" fill="black"/>
            </svg>
        </button>
    </div>

    <label>Output Directory (Clean Archive)</label>
    <div class="input-group">
        <input type="text" id="output" placeholder="e.g. D:\Project_MetaSort\Sorted_Output">
        <button class="browse-btn" onclick="selectFolder('output')" title="Browse Folders">
            <svg width="24" height="25" viewBox="0 -2 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.25 15.75C11.25 16.1642 11.5857 16.5 12 16.5C12.4142 16.5 12.75 16.1642 12.75 15.75V13.75H14.75C15.1642 13.75 15.5 13.4142 15.5 13C15.5 12.5858 15.1642 12.25 14.75 12.25H12.75V10.25C12.75 9.83579 12.4142 9.5 12 9.5C11.5857 9.5 11.25 9.83579 11.25 10.25V12.25H9.24996C8.83574 12.25 8.49996 12.5858 8.49996 13C8.49996 13.4142 8.83574 13.75 9.24996 13.75H11.25V15.75Z" fill="black"/>
                <path fill-rule="evenodd" clip-rule="evenodd" d="M10.5857 4.58579L12 6H20C21.1045 6 22 6.89543 22 8V18C22 19.1046 21.1045 20 20 20H3.99995C2.89539 20 1.99995 19.1046 1.99995 18V6C1.99995 4.89543 2.89538 4 3.99995 4H9.17153C9.70196 4 10.2107 4.21071 10.5857 4.58579ZM12 7.5C11.6021 7.5 11.2206 7.34196 10.9393 7.06066L9.52508 5.64645C9.43131 5.55268 9.30414 5.5 9.17153 5.5H3.99995C3.72381 5.5 3.49995 5.72386 3.49995 6V18C3.49995 18.2761 3.72381 18.5 3.99995 18.5H20C20.2761 18.5 20.5 18.2761 20.5 18V8C20.5 7.72386 20.2761 7.5 20 7.5H12Z" fill="black"/>
            </svg>
        </button>
    </div>

    <label>Storage Architecture</label>
    <select id="mode" onchange="toggleWarning()">
        <option value="--hardlink">Optimize Space (Zero-Space Hard Links)</option>
        <option value="--copy">Standard Sandbox (Copy Files)</option>
    </select>

    <div id="warning-box" class="warning">
        
        <svg width="10" height="12" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10.9994 2.17806C11.6185 1.82037 12.3815 1.82037 13.0006 2.17806L20.0006 6.2225C20.619 6.57985 21 7.23993 21 7.95423V16.0457C21 16.76 20.619 17.4201 20.0006 17.7774L13.0006 21.8219C12.3815 22.1796 11.6185 22.1796 10.9994 21.8219L3.99944 17.7774C3.38095 17.4201 3 16.76 3 16.0457V7.95423C3 7.23993 3.38096 6.57985 3.99944 6.2225L10.9994 2.17806ZM18.7512 7.23305L12 11.1338L5.24875 7.23305L11.7499 3.47686C11.9046 3.38743 12.0954 3.38743 12.2501 3.47686L18.7512 7.23305ZM4.74986 16.4786C4.59524 16.3893 4.5 16.2243 4.5 16.0457V8.53281L11.25 12.4328V20.2343L4.74986 16.4786ZM19.2501 16.4786L12.75 20.2343V12.4328L19.5 8.53281V16.0457C19.5 16.2243 19.4048 16.3893 19.2501 16.4786Z" fill="black"/>
        </svg>

        
        <b>Architectural Note:</b> To conserve disk space, MetaSort utilizes physical hard links. The sorted files are locked by the OS in Read-Only mode. To edit a photo, you must use <b>Save As...</b>
    </div>

    <button onclick="runEngine()">INITIALIZE ENGINE</button>
    
    <pre id="log">Waiting for system command...</pre>
</div>

<script>

    // Require Electron's IPC bridge to talk to main.js
    const { ipcRenderer } = require('electron');

    // Ask the main process to open the OS folder dialog
    async function selectFolder(inputId) {
        const folderPath = await ipcRenderer.invoke('dialog:openDirectory');
        if (folderPath) {
            // Update the UI text box with the chosen path
            document.getElementById(inputId).value = folderPath;
        }
    }

    // Keep the exact same logic we just built!
    function toggleWarning() {
        const mode = document.getElementById("mode").value;
        document.getElementById("warning-box").style.display = (mode === "--hardlink") ? "block" : "none";
    }
    toggleWarning(); 

    async function runEngine() {
        const source = document.getElementById("source").value;
        const output = document.getElementById("output").value;
        const mode = document.getElementById("mode").value;
        const logWindow = document.getElementById("log");

        logWindow.innerText = "Executing C++ Backend... Please wait.\n";

        try {
            const response = await fetch('http://localhost:3000/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source, output, mode })
            });

            const result = await response.text();
            logWindow.innerText += result;
        } catch (error) {
            logWindow.innerText = "[CRITICAL ERROR] Failed to connect to Node.js Bridge Server.\nMake sure 'node server.js' is running in the terminal.";
        }
    }
</script>

</body>
</html>
