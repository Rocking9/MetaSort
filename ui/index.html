<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaSort UI</title>
    <style>
        /* 1. The Desktop Background (Vibrant enough to show off the glass) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 40px; 
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* Deep Win7-esque teal */
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. The Aero Glass Pane (The magic is backdrop-filter) */
        .container { 
            width: 100%;
            max-width: 500px; 
            padding: 35px; 
            border-radius: 12px; 
            
            /* The Frosted Glass Illusion */
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            
            /* The subtle light border that defines Win7 */
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            
            /* The drop shadow for physical depth */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); 
        }

        h2 {
            margin-top: 0;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        label {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            display: block;
            margin-top: 20px;
        }

        /* 3. Minimalistic Input Fields (Inset Glass) */
        input, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 8px; 
            border-radius: 6px; 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white;
            font-family: monospace;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Style the dropdown options so they don't look broken in dark mode */
        option { background: #203a43; color: white; }

        /* 4. The Execution Button */
        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 25px;
            margin-bottom: 20px; 
            border-radius: 6px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            font-weight: bold; 
            letter-spacing: 1px;
            cursor: pointer; 
            transition: all 0.2s ease; 
        }

        button:hover { 
            background: rgba(255, 255, 255, 0.2); 
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        
        button:active {
            transform: scale(0.98);
        }

        /* 5. Warning & Terminal Output */
        .warning { 
            background: rgba(255, 204, 0, 0.15); 
            border-left: 4px solid #ffcc00;
            color: #fff; 
            padding: 12px; 
            margin-top: 20px;
            border-radius: 4px; 
            font-size: 0.85em; 
            display: none; 
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        pre {
            background: rgba(0, 0, 0, 0.4); 
            padding: 15px; 
            border-radius: 6px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow-x: auto; 
            font-size: 0.8em;
            color: #00ffcc; /* Hacker terminal green/cyan */
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MetaSort</h2>
    
    <label>Source Directory (Messy Photos)</label>
    <input type="text" id="source" placeholder="e.g. D:\Project_MetaSort\test_data">

    <label>Output Directory (Clean Archive)</label>
    <input type="text" id="output" placeholder="e.g. D:\Project_MetaSort\Sorted_Output">

    <label>Storage Architecture</label>
    <select id="mode" onchange="toggleWarning()">
        <option value="--hardlink">Optimize Space (Zero-Space Hard Links)</option>
        <option value="--copy">Standard Sandbox (Copy Files)</option>
    </select>

    <div id="warning-box" class="warning">
        ⚠️ <b>Architectural Note:</b> To conserve disk space, MetaSort utilizes physical hard links. The sorted files are locked by the OS in Read-Only mode. To edit a photo, you must use <b>Save As...</b>
    </div>

    <button onclick="runEngine()">INITIALIZE ENGINE</button>
    
    <pre id="log">Waiting for system command...</pre>
</div>

<script>
    // Keep the exact same logic we just built!
    function toggleWarning() {
        const mode = document.getElementById("mode").value;
        document.getElementById("warning-box").style.display = (mode === "--hardlink") ? "block" : "none";
    }
    toggleWarning(); 

    async function runEngine() {
        const source = document.getElementById("source").value;
        const output = document.getElementById("output").value;
        const mode = document.getElementById("mode").value;
        const logWindow = document.getElementById("log");

        logWindow.innerText = "Executing C++ Backend... Please wait.\n";

        try {
            const response = await fetch('http://localhost:3000/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ source, output, mode })
            });

            const result = await response.text();
            logWindow.innerText += result;
        } catch (error) {
            logWindow.innerText = "[CRITICAL ERROR] Failed to connect to Node.js Bridge Server.\nMake sure 'node server.js' is running in the terminal.";
        }
    }
</script>

</body>
</html>
